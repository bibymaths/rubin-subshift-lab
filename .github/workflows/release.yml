name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=rubin_subshifts --cov-branch --cov-fail-under=90
      - run: uv run zensical build --clean --strict
      - run: uv build
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

